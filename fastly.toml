
authors = []
cloned_from = "https://github.com/fastly/compute-starter-kit-javascript-empty"
description = "DRiV Parts Finder AEM Edge Functions"
language = "javascript"
manifest_version = 3
name = "aem-edge-functions-boilerplate"
service_id = ""

[scripts]
build = "npm run build"
post_init = "npm install"

[local_server]

[local_server.backends]
[local_server.backends.open-meteo]
url = "https://api.open-meteo.com"

[local_server.backends.pdm_api]
url = "https://driv-search-api-os-cache.pdm-automotive.com"

[local_server.config_stores]

[local_server.config_stores.config_default]
format = "inline-toml"

[local_server.config_stores.config_default.contents]
LOG_LEVEL = "debug"
PDM_BASE_URL = "https://driv-search-api-os-cache.pdm-automotive.com/v1"
PDM_REGION_ID = "1,2"
PDM_BRAND_CODES_CORPORATE = "BDCM" # Postman sample only; NOT confirmed corporate mapping
PDM_CUSTOM_FIELDS = ""
PDM_DYNAMIC_SUB_CONFIG_TYPES = "drive,engine_base,sub_model,body_type,body_door,engine_designation,engine_vin,transmission_base_type,transmission_base_control_type,transmission_base_gear,transmission_mfr_code,wheel_base,brake_abs,steering_system,transmission_mfr,engine_fuel_delivery_sub_type,engine_version,engine_fuel_type,engine_aspiration,engine_cylinder_head_type,engine_fuel_delivery_type,engine_valve,bed_length"

[local_server.secret_stores]
[[local_server.secret_stores.secret_default]]
key = "PDM_API_TOKEN"
data = "98dce83da57b0395e163467c9dae521b1415fe9fea0fa1e45dddcff5682239a0"